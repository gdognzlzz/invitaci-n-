<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>¿Quieres jugar Roblox conmigo? 💗</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff5fa2;--pink-l:#ffd6e8;--pink-xl:#fff0f6;--ink:#1a1a1a;--white:#fff;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{margin:0;min-height:100%;background:var(--pink-l);color:var(--ink);font-family:"Baloo 2","Comic Sans MS",system-ui,sans-serif;
background-image:radial-gradient(var(--pink) 2px,transparent 2.5px);background-size:28px 28px;overflow-x:hidden}
.hearts{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.heart{position:absolute;bottom:-60px;color:var(--pink);text-shadow:2px 2px 0 var(--ink);animation:up linear infinite;opacity:.9}
@keyframes up{to{transform:translateY(-115vh) rotate(25deg)}}
main{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:440px;background:var(--white);border:4px solid var(--ink);border-radius:28px;box-shadow:8px 8px 0 var(--ink);padding:28px 22px;text-align:center}
.screen{display:none}.screen.on{display:block;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
h1{font-size:clamp(1.9rem,8vw,2.5rem);line-height:1.1;margin:8px 0 22px;font-weight:800}
.big{font-size:4rem;line-height:1}
.row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
button,.btn{font:inherit;font-weight:800;font-size:1.4rem;color:var(--ink);background:var(--white);border:3px solid var(--ink);border-radius:999px;
padding:10px 30px;box-shadow:4px 4px 0 var(--ink);cursor:pointer;transition:transform .1s,box-shadow .1s}
button:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
button:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
button:focus-visible,input:focus-visible{outline:4px solid var(--pink);outline-offset:3px}
.yes{background:var(--pink)}
.no{background:var(--ink);color:var(--white)}
label{display:block;text-align:left;font-weight:700;margin:14px 0 6px;font-size:1.1rem}
input{width:100%;font:inherit;font-size:1.2rem;padding:10px 14px;border:3px solid var(--ink);border-radius:16px;background:var(--pink-xl);color:var(--ink)}
.go{margin-top:22px;width:100%;background:var(--pink)}
.err{color:#c4004f;font-weight:700;min-height:1.4em;margin:10px 0 0}
.mad{font-size:5rem;animation:shake .5s infinite}
@keyframes shake{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@media (prefers-reduced-motion:reduce){.heart,.mad{animation:none}.screen.on{animation:none}}
</style>
</head>
<body>
<div class="hearts" id="hearts" aria-hidden="true"></div>
<main>
<div class="card">

<section class="screen on" id="ask">
<div class="big">🎮💗</div>
<h1>¿Quieres jugar Roblox conmigo?</h1>
<div class="row">
<button class="yes" id="yes">Sí 💖</button>
<button class="no" id="no">No</button>
</div>
</section>

<section class="screen" id="mad">
<div class="mad">😡</div>
<h1>¡Cómo te atreves! 😡</h1>
<button id="back">Volver</button>
</section>

<section class="screen" id="book">
<div class="big">📅💗</div>
<h1>Haz una reservación</h1>
<label for="date">Elige el día</label>
<input type="date" id="date">
<label for="time">Elige la hora</label>
<input type="time" id="time">
<p class="err" id="err" role="alert"></p>
<button class="go" id="send">Enviar por WhatsApp 💌</button>
</section>

</div>
</main>
<script>
var PHONE="527714423130";
function show(id){document.querySelectorAll(".screen").forEach(function(s){s.classList.toggle("on",s.id===id)})}
document.getElementById("yes").onclick=function(){show("book")};
document.getElementById("no").onclick=function(){show("mad")};
document.getElementById("back").onclick=function(){show("ask")};
var d=document.getElementById("date");
var t=new Date();
d.min=t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");
document.getElementById("send").onclick=function(){
var date=d.value,time=document.getElementById("time").value,err=document.getElementById("err");
if(!date||!time){err.textContent="Elige el día y la hora para continuar.";return}
err.textContent="";
var p=date.split("-"),fecha=p[2]+"/"+p[1]+"/"+p[0];
var h=parseInt(time.slice(0,2),10),hora=((h+11)%12+1)+time.slice(2)+(h<12?" am":" pm");
var msg="Hola amor de mi vida, quisiera hacer una reservación:\n📅 Fecha: "+fecha+"\n🕐 Hora: "+hora+"\n🎮 Para jugar Roblox contigo 💗";
window.location.href="https://wa.me/"+PHONE+"?text="+encodeURIComponent(msg);
};
var box=document.getElementById("hearts");
for(var i=0;i<18;i++){var e=document.createElement("span");e.className="heart";e.textContent="♥";
e.style.left=Math.random()*100+"%";e.style.fontSize=(18+Math.random()*34)+"px";
e.style.animationDuration=(9+Math.random()*10)+"s";e.style.animationDelay=(-Math.random()*15)+"s";box.appendChild(e)}
</script>
</body>
</html>
